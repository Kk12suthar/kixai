    rel="stylesheet">
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('mode');
        var stored = q === 'calm' || q === 'rage' ? q : localStorage.getItem('kixai-emotional-mode');
        document.documentElement.dataset.theme = stored === 'calm' ? 'calm' : 'rage';
        var f = new URLSearchParams(location.search).get('font');
        if (f === 'a' || f === 'b') localStorage.setItem('kix-font', f);
        else f = localStorage.getItem('kix-font');
        document.documentElement.dataset.font = f === 'b' ? 'b' : 'a';
      } catch (error) {
        document.documentElement.dataset.theme = 'rage';
        document.documentElement.dataset.font = 'a';
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>

</body>
